spring.application.name=educonnect-backend
server.port=8080

# -------------------------------------------------------------
# CONFIGURACIÓN DE CONEXIÓN A BASE DE DATOS POSTGRESQL (SUPABASE / LOCAL)
# -------------------------------------------------------------
# Puedes configurar estas variables de entorno en tu sistema o reemplazar los valores por defecto:
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/educonnect}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# -------------------------------------------------------------
# SEGURIDAD Y JWT
# -------------------------------------------------------------
# Clave secreta para firmar tokens JWT (mínimo 256 bits)
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
# Tiempo de expiración del token (24 horas en milisegundos)
app.jwt.expiration-ms=86400000

# -------------------------------------------------------------
# CONFIGURACIÓN CORS (React Web & React Native Móvil)
# -------------------------------------------------------------
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000,http://localhost:19006,exp://localhost:19000

