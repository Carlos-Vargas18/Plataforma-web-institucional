# ==============================================================================
# CONFIGURACIÓN EMPRESARIAL EDUCONNECT (SPRING BOOT + POSTGRESQL / SUPABASE)
# Todas las credenciales sensibles se inyectan exclusivamente vía Variables de Entorno
# ==============================================================================
spring.application.name=educonnect-backend
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]
server.address=0.0.0.0
server.port=${PORT:8080}

# --- CONEXIÓN BASE DE DATOS (PostgreSQL / Supabase por defecto) ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/educonnect_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.postgresql.Driver}

# --- HIBERNATE / JPA ---
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# --- FLYWAY MIGRATIONS ---
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true

# --- SEGURIDAD Y JWT (Requiere variable JWT_SECRET en producción, mínimo 256 bits) ---
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=${JWT_EXPIRATION:86400000}

# --- CORS PERMITIDOS (Separados por coma) ---
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,http://localhost,https://localhost,capacitor://localhost}

# --- CORREO INSTITUCIONAL (Spring Mail / SMTP) ---
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# --- SEMILLA INICIAL DE DATOS ---
app.seed.default-password=${APP_SEED_DEFAULT_PASSWORD:}
