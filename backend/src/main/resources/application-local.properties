# ==============================================================================
# PERFIL LOCAL AUTOCONTENIDO (H2 EN MODO COMPATIBILIDAD POSTGRESQL)
# Uso: mvn spring-boot:run -Dspring-boot.run.profiles=local
# ==============================================================================
spring.datasource.url=jdbc:h2:mem:educonnect_local;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false
